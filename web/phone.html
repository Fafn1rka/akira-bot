<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Акира</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0e22;color:#e8ecff;font-family:system-ui,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#141a3c;font-size:15px}
  #dot{width:9px;height:9px;border-radius:50%;background:#6b7599}#dot.on{background:#4ade80}
  header span.sp{flex:1}
  header label{font-size:13px;opacity:.8;display:flex;align-items:center;gap:4px}
  #log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .u{align-self:flex-end;background:#2f4bd8}.a{align-self:flex-start;background:#1d2450}
  .s{align-self:center;font-size:13px;opacity:.65}
  form{display:flex;gap:8px;padding:10px 12px;background:#141a3c}
  input{flex:1;font-size:16px;padding:11px 14px;border-radius:22px;border:0;background:#222a5c;color:#fff;outline:none}
  button{font-size:15px;border:0;border-radius:22px;padding:0 18px;background:#38d6ff;color:#06222b}
  #card{display:none;margin:8px 14px;padding:14px;border-radius:14px;background:#2a2150;border:1px solid #6d5bd0}
  #card p{margin:0 0 12px}#card button{margin-right:8px;padding:9px 20px}
  #no{background:#475069;color:#fff}
  #setup{display:none;padding:24px;text-align:center}
  #setup input{width:80%;margin:12px 0}
</style>
</head>
<body>
<header><span id="dot"></span><b>Акира</b><span class="sp"></span>
  <label><input type="checkbox" id="tts" style="flex:none;width:auto"> озвучка</label>
  <button id="forget" style="padding:4px 10px;font-size:12px;background:#475069;color:#fff">выйти</button></header>
<div id="setup"><p>Вставьте токен из консоли Акиры (или откройте ссылку, которую она показала).</p>
  <input id="tok" placeholder="токен"><br><button id="save" style="padding:10px 24px">Войти</button></div>
<div id="log"></div>
<div id="card"><p id="ctext"></p><button id="yes" style="background:#4ade80;color:#06210f">Разрешить</button><button id="no">Отмена</button></div>
<form id="f"><input id="q" placeholder="Напишите Акире (микрофон - на клавиатуре)" autocomplete="off"><button>➤</button></form>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('akira_token')||'';
const m=location.hash.match(/t=([\w-]+)/);
if(m){token=m[1];localStorage.setItem('akira_token',token);history.replaceState(null,'',location.pathname);}
const api=(p,o={})=>fetch(p,{...o,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;$('log').appendChild(d);$('log').scrollTop=1e9;return d;}
function speak(t){if(!$('tts').checked||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';speechSynthesis.speak(u);}
$('forget').onclick=()=>{localStorage.removeItem('akira_token');location.reload();};
$('save').onclick=()=>{token=$('tok').value.trim();localStorage.setItem('akira_token',token);location.reload();};
async function events(){
  try{
    const r=await fetch('/api/events',{headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){$('setup').style.display='block';$('f').style.display='none';return;}
    $('dot').className='on';
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+2);
        if(line.startsWith('data:'))handle(JSON.parse(line.slice(5)));}}
  }catch(e){}
  $('dot').className='';setTimeout(events,3000);
}
let cid=null;
function handle(e){
  if(e.type==='confirm'){cid=e.id;$('ctext').textContent=e.text;$('card').style.display='block';}
  else if(e.type==='confirm_done'){$('card').style.display='none';}
  else if(e.type==='notice'){add('s','🔔 '+e.text);speak(e.text);}
  else if(e.type==='tool'){add('s','⚙ '+e.name);}
}
function ans(ok){$('card').style.display='none';api('/api/confirm',{method:'POST',body:JSON.stringify({id:cid,approved:ok})});}
$('yes').onclick=()=>ans(true);$('no').onclick=()=>ans(false);
$('f').onsubmit=async ev=>{
  ev.preventDefault();const t=$('q').value.trim();if(!t)return;$('q').value='';add('u',t);
  const w=add('s','Акира думает…');
  try{
    const r=await api('/api/chat',{method:'POST',body:JSON.stringify({text:t})});
    const j=await r.json();w.remove();
    if(j.error)add('s','⚠ '+j.error);else{add('a',j.answer);speak(j.answer);}
  }catch(e){w.remove();add('s','⚠ нет связи с ПК');}
};
if(!token){$('setup').style.display='block';$('f').style.display='none';}else events();
</script>
</body>
</html>
